name: server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run build linux-x64,linux-arm64,darwin-arm64
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          export V="${GITHUB_REF_NAME#v}" URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          envsubst '$V $URL' < ../.github/release.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/hollr-* --title "Hollr $V" --notes-file notes.md --generate-notes --repo "$GITHUB_REPOSITORY"
