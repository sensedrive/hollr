[package]
name = "hollr-desktop"
version = "0.32.2"
description = "Hollr desktop client"
authors = ["Hollr contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hollr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.64.1"
tokio = { version = "1.53.3", features = ["full"] }
base64 = "0.23.1"
sha2 = "0.11.1"
dirs = "7.0.0"
anyhow = "1.0.104"
getrandom = "0.4.3"
cpal = "0.18.2"
tauri-plugin-notification = "2"
# local dictation (dictation.rs): whisper.cpp + model downloads from Hugging Face
whisper-rs = "0.16"
ureq = "3"
# pairing by one-time code (pairing_code.rs); same versions russh already pulls in
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# app lock (applock.rs): Touch ID / device password; same objc2 versions tauri already pulls in
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LABiometryType"] }

[dev-dependencies]
# examples/dictate.rs reads WAV files
hound = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# build scripts and proc macros: stripped dylibs fail to load with newer Xcode toolchains
# ("mis-aligned LINKEDIT string pool"); only the shipped binary needs stripping
[profile.release.build-override]
strip = false
