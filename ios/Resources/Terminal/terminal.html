<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f1216; overflow-x: auto; overflow-y: hidden; touch-action: pan-x pan-y pinch-zoom; }
  #term { position: absolute; inset: 0; padding: 4px; }
  .xterm .xterm-viewport { overflow-y: hidden !important; }
  /* own shell: a normal terminal – scrolls, no sideways panning */
  body.shell { overflow: hidden; }
  body.shell .xterm .xterm-viewport { overflow-y: auto !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script>
  // Hollr terminal: the server sends the pane's visible screen (ANSI) – this draws it at a font size
  // that fits the phone, and passes what you type back. The pane itself is never resized.
  const post = (name, value) => window.webkit?.messageHandlers?.[name]?.postMessage(value);
  const term = new Terminal({
    fontFamily: 'Menlo, ui-monospace, monospace', fontSize: 12, lineHeight: 1.0,
    cursorBlink: false, scrollback: 0, disableStdin: true, convertEol: false, allowProposedApi: true,
    theme: { background: '#0f1216', foreground: '#d7dae0', cursor: '#7aa2f7' },
  });
  term.open(document.getElementById('term'));
  let cols = 80, rows = 24, ctrl = false, readCols = 0;

  // draw at a fixed font size, then scale the drawn screen to the phone's width (exact, whatever the
  // font's real cell width is)
  function fit() {
    const el = document.getElementById('term');
    const screen = el.querySelector('.xterm-screen');
    if (!screen || !screen.offsetWidth) return;
    // readable: only `readCols` columns fill the width, the rest is reached by swiping sideways
    const share = readCols > 0 && readCols < cols ? readCols / cols : 1;
    const scale = Math.min(1.6, (window.innerWidth - 8) / (screen.offsetWidth * share));
    el.style.transformOrigin = '0 0';
    el.style.transform = `scale(${scale})`;
    // layout size of the unscaled screen; the scaled box is what scrolls sideways
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.width = `${screen.offsetWidth + 8}px`;
    el.style.height = `${window.innerHeight / scale}px`;
  }

  window.render = (ansi, r, c) => {
    if (c > 0 && r > 0 && (c !== cols || r !== rows)) { cols = c; rows = r; term.resize(cols, rows); }
    term.write('\x1b[H\x1b[2J\x1b[3J' + ansi.replace(/\r?\n/g, '\r\n'), () => requestAnimationFrame(fit));
  };
  window.armCtrl = (on) => { ctrl = on; };
  window.setReadable = (n) => { readCols = n; fit(); window.scrollTo(0, 0); };
  window.focusTerm = () => term.focus();
  // own shell (`hollr gate shell`): the terminal takes the phone's size, output is a raw stream
  let shell = false;
  function fitShell() {
    const cell = term._core?._renderService?.dimensions?.css?.cell;
    if (!cell || !cell.width || !cell.height) return;
    const c = Math.max(20, Math.floor((window.innerWidth - 8) / cell.width));
    const r = Math.max(5, Math.floor((window.innerHeight - 8) / cell.height));
    if (c !== term.cols || r !== term.rows) term.resize(c, r);
    post('size', { cols: c, rows: r });
  }
  window.shellMode = () => {
    shell = true;
    document.body.classList.add('shell');
    const el = document.getElementById('term');
    el.style.transform = ''; el.style.width = ''; el.style.height = ''; el.style.right = ''; el.style.bottom = '';
    term.options.scrollback = 3000;
    term.options.fontSize = 13;
    requestAnimationFrame(fitShell);
  };
  window.writeRaw = (data) => term.write(data);
  window.addEventListener('resize', () => (shell ? fitShell() : fit()));

  term.onData((data) => {
    if (ctrl && data.length === 1) {
      const code = data.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) data = String.fromCharCode(code - 64);
      ctrl = false;
      post('ctrlUsed', true);
    }
    post('input', data);
  });
  // iOS pastes into xterm's hidden textarea as an `insertFromPaste` input (no paste event, which
  // xterm would handle and cancel) – pass it on, line breaks as Enter
  term.textarea?.addEventListener('input', (e) => {
    if (e.inputType === 'insertFromPaste' && e.data) {
      post('input', e.data.replace(/\r?\n/g, '\r'));
      term.textarea.value = '';
    }
  });
  // typing goes through the app's own key input: xterm's textarea must not take the focus
  if (term.textarea) {
    term.textarea.readOnly = true;
    term.textarea.tabIndex = -1;
    term.textarea.addEventListener('focus', () => term.textarea.blur());
  }
  post('ready', true);
</script>
</body>
</html>
