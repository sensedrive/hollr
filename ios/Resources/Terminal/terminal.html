<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes">
<link rel="stylesheet" href="xterm.css">
<style>
  /* Nerd Fonts symbols (MIT, github.com/ryanoasis/nerd-fonts) – only the private-use icons shell prompts draw
     (powerline arrows, git branch …) */
  @font-face {
    font-family: "Symbols Nerd Font Mono";
    src: url("SymbolsNerdFontMono-Regular.ttf") format("truetype");
    unicode-range: U+E000-F8FF, U+F0000-FFFFD, U+100000-10FFFD, U+23FB-23FE, U+2B58, U+2665, U+26A1;
  }
  html, body { margin: 0; height: 100%; background: #0f1216; overflow-x: auto; overflow-y: hidden; touch-action: pan-x pan-y pinch-zoom; }
  #term { position: absolute; inset: 0; padding: 4px; -webkit-touch-callout: none; }
  .xterm .xterm-viewport { overflow-y: hidden !important; }
  /* own shell: a normal terminal – scrolls, no sideways panning */
  body.shell { overflow: hidden; }
  body.shell .xterm .xterm-viewport { overflow-y: auto !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script>
  // Hollr terminal: the server sends the pane's visible screen (ANSI) – this draws it at a font size
  // that fits the phone, and passes what you type back. The pane itself is never resized.
  const post = (name, value) => window.webkit?.messageHandlers?.[name]?.postMessage(value);
  const term = new Terminal({
    fontFamily: 'Menlo, ui-monospace, "Symbols Nerd Font Mono", monospace', fontSize: 12, lineHeight: 1.0,
    cursorBlink: false, scrollback: 0, disableStdin: true, convertEol: false, allowProposedApi: true,
    theme: { background: '#0f1216', foreground: '#d7dae0', cursor: '#7aa2f7' },
    // OSC 8 hyperlinks (a click on them)
    linkHandler: { activate: (e, uri) => post('link', uri) },
  });
  term.open(document.getElementById('term'));
  let cols = 80, rows = 24, ctrl = false, readCols = 0;

  // draw at a fixed font size, then scale the drawn screen to the phone's width (exact, whatever the
  // font's real cell width is)
  function fit() {
    const el = document.getElementById('term');
    const screen = el.querySelector('.xterm-screen');
    if (!screen || !screen.offsetWidth) return;
    // readable: only `readCols` columns fill the width, the rest is reached by swiping sideways
    const share = readCols > 0 && readCols < cols ? readCols / cols : 1;
    const scale = Math.min(1.6, (window.innerWidth - 8) / (screen.offsetWidth * share));
    el.style.transformOrigin = '0 0';
    el.style.transform = `scale(${scale})`;
    // layout size of the unscaled screen; the scaled box is what scrolls sideways
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.width = `${screen.offsetWidth + 8}px`;
    el.style.height = `${window.innerHeight / scale}px`;
  }

  window.render = (ansi, r, c) => {
    if (c > 0 && r > 0 && (c !== cols || r !== rows)) { cols = c; rows = r; term.resize(cols, rows); }
    term.write('\x1b[H\x1b[2J\x1b[3J' + ansi.replace(/\r?\n/g, '\r\n'), () => requestAnimationFrame(fit));
  };
  window.armCtrl = (on) => { ctrl = on; };
  window.setReadable = (n) => { readCols = n; if (!shell) { fit(); window.scrollTo(0, 0); } };
  window.focusTerm = () => term.focus();
  // own shell (`hollr gate shell`): the terminal takes the phone's size, output is a raw stream
  let shell = false;
  function fitShell() {
    const cell = term._core?._renderService?.dimensions?.css?.cell;
    if (!cell || !cell.width || !cell.height) return;
    const c = Math.max(20, Math.floor((window.innerWidth - 8) / cell.width));
    const r = Math.max(5, Math.floor((window.innerHeight - 8) / cell.height));
    if (c !== term.cols || r !== term.rows) term.resize(c, r);
    post('size', { cols: c, rows: r });
  }
  window.shellMode = () => {
    shell = true;
    document.body.classList.add('shell');
    const el = document.getElementById('term');
    el.style.transform = ''; el.style.width = ''; el.style.height = ''; el.style.right = ''; el.style.bottom = '';
    term.options.scrollback = 3000;
    term.options.fontSize = 13;
    requestAnimationFrame(fitShell);
  };
  window.writeRaw = (data) => term.write(data);

  // a full-screen TUI (omp, Claude …) has no scrollback of its own: a swipe becomes mouse-wheel
  // input for it, the way a trackpad scrolls it on the computer – and a flick glides on like iOS scrolling
  const STEP = 12; // finger travel (px) per wheel step; herdr scrolls 3 lines a step
  let touchY = null, acc = 0, velocity = 0, lastT = 0, glide = 0;
  const el = document.getElementById('term');
  const scrollsTui = () => shell && term.buffer.active.type === 'alternate' && term.modes.mouseTrackingMode !== 'none';
  function wheel(dy) {
    acc += dy;
    const col = Math.floor(term.cols / 2) + 1, row = Math.floor(term.rows / 2) + 1;
    let seq = '';
    while (Math.abs(acc) >= STEP) {
      // finger down = content down = scroll up (button 64), finger up = scroll down (65)
      seq += `\x1b[<${acc > 0 ? 64 : 65};${col};${row}M`;
      acc += acc > 0 ? -STEP : STEP;
    }
    if (seq) post('input', seq);
  }
  el.addEventListener('touchstart', (e) => {
    cancelAnimationFrame(glide);
    touchY = e.touches[0].clientY; acc = 0; velocity = 0; lastT = e.timeStamp;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (touchY === null || !scrollsTui()) return; // normal screen: xterm scrolls itself
    const y = e.touches[0].clientY;
    const dt = Math.max(1, e.timeStamp - lastT);
    velocity = 0.8 * ((y - touchY) / dt) + 0.2 * velocity; // px per ms, smoothed
    lastT = e.timeStamp;
    wheel(y - touchY);
    touchY = y;
    e.preventDefault();
  }, { passive: false });
  el.addEventListener('touchend', (e) => {
    touchY = null;
    // a flick (fast, and still moving when the finger left) glides on and slows down
    if (!scrollsTui() || Math.abs(velocity) < 0.3 || e.timeStamp - lastT > 80) return;
    let v = velocity, t0 = performance.now();
    const step = (now) => {
      const dt = now - t0;
      t0 = now;
      wheel(v * dt);
      v *= Math.pow(0.995, dt);
      if (Math.abs(v) > 0.05) glide = requestAnimationFrame(step);
    };
    glide = requestAnimationFrame(step);
  });
  window.addEventListener('resize', () => (shell ? fitShell() : fit()));

  // ---- text under the finger: links (tap) and selecting text (long press) ----
  // buffer cell under a point – from the drawn screen's box, so the CSS scale doesn't matter
  function cellAt(x, y) {
    const screen = document.querySelector('.xterm-screen');
    if (!screen) return null;
    const r = screen.getBoundingClientRect();
    if (x < r.left || y < r.top || x >= r.right || y >= r.bottom) return null;
    const col = Math.floor((x - r.left) / (r.width / term.cols));
    const row = Math.floor((y - r.top) / (r.height / term.rows));
    return { row: term.buffer.active.viewportY + row, col };
  }
  // a wrapped line as one string, and the string index of a cell in it (wide chars take two cells)
  function logicalLine(row, col) {
    const buf = term.buffer.active;
    let first = row;
    while (first > 0 && buf.getLine(first)?.isWrapped) first--;
    let text = '', at = 0;
    for (let y = first; y < buf.length; y++) {
      const line = buf.getLine(y);
      if (!line || (y > first && !line.isWrapped)) break;
      if (y === row) at = text.length + line.translateToString(false, 0, col).length;
      text += line.translateToString(false);
    }
    return { text, at };
  }
  const URL_RE = /\b(?:https?:\/\/|www\.)[^\s<>"'`]+|\b(?:localhost|127\.0\.0\.1):\d{2,5}(?:\/[^\s<>"'`]*)?/g;
  const count = (s, c) => s.split(c).length - 1;
  // sentence punctuation after a link, a closing bracket the link didn't open
  function trimUrl(url) {
    while (/[.,;:!?'"\]}>]$/.test(url) || (url.endsWith(')') && count(url, '(') < count(url, ')'))) url = url.slice(0, -1);
    return url;
  }
  function urlAt(x, y) {
    const cell = cellAt(x, y);
    if (!cell) return null;
    const { text, at } = logicalLine(cell.row, cell.col);
    for (const m of text.matchAll(URL_RE)) {
      const url = trimUrl(m[0]);
      if (at >= m.index && at < m.index + url.length) {
        return /^https?:/i.test(url) ? url : (url.startsWith('www.') ? 'https://' : 'http://') + url;
      }
    }
    return null;
  }
  // everything in the buffer (scrollback + screen) as plain text, and where the finger was in it
  function allText(x, y) {
    const buf = term.buffer.active;
    const cell = cellAt(x, y);
    let text = '', offset = 0;
    for (let row = 0; row < buf.length; row++) {
      const line = buf.getLine(row);
      if (!line) continue;
      if (row > 0 && !line.isWrapped) text += '\n';
      if (cell && row === cell.row) offset = text.length + line.translateToString(false, 0, cell.col).length;
      // trailing blanks only where the line really ends, not where it wraps on
      text += line.translateToString(!buf.getLine(row + 1)?.isWrapped);
    }
    text = text.replace(/\s+$/, '');
    return { text, offset: Math.min(offset, text.length) };
  }

  // tap: a link opens (else the app brings up the keyboard) · long press: select text natively
  // a handled tap / long press: no synthetic click for xterm (would go to the TUI as a mouse click)
  let press = null, consumed = false;
  el.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || e.button > 0) return;
    const p = { x: e.clientX, y: e.clientY, done: false };
    if (e.pointerType !== 'mouse') {
      p.timer = setTimeout(() => {
        p.done = true;
        post('select', allText(p.x, p.y));
      }, 500);
    }
    press = p;
  });
  el.addEventListener('pointermove', (e) => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press.moved = true; }
  });
  el.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });
  el.addEventListener('pointerup', (e) => {
    const p = press;
    press = null;
    if (!p) return;
    clearTimeout(p.timer);
    if (p.done || p.moved) { consumed = p.done; return; }
    const url = urlAt(e.clientX, e.clientY);
    if (url) { consumed = true; post('link', url); } else post('tap', true);
  });
  el.addEventListener('touchend', (e) => { if (consumed) e.preventDefault(); consumed = false; }, { passive: false });
  // mouse (Mac): right click selects text
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); post('select', allText(e.clientX, e.clientY)); });

  term.onData((data) => {
    if (ctrl && data.length === 1) {
      const code = data.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) data = String.fromCharCode(code - 64);
      ctrl = false;
      post('ctrlUsed', true);
    }
    post('input', data);
  });
  // iOS pastes into xterm's hidden textarea as an `insertFromPaste` input (no paste event, which
  // xterm would handle and cancel) – pass it on, line breaks as Enter
  term.textarea?.addEventListener('input', (e) => {
    if (e.inputType === 'insertFromPaste' && e.data) {
      post('input', e.data.replace(/\r?\n/g, '\r'));
      term.textarea.value = '';
    }
  });
  // typing goes through the app's own key input: xterm's textarea must not take the focus
  if (term.textarea) {
    term.textarea.readOnly = true;
    term.textarea.tabIndex = -1;
    term.textarea.addEventListener('focus', () => term.textarea.blur());
  }
  post('ready', true);
</script>
</body>
</html>
