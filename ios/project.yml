name: Hollr
options:
  bundleIdPrefix: app.hollr
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.22.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: "31"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.18.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
targets:
  Hollr:
    type: application
    platform: iOS
    sources:
      - path: Sources/Hollr
      - path: Resources
    dependencies:
      - package: Citadel
      - package: MarkdownUI
      - package: WhisperKit
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY_MACCATALYST: "6"
        TARGETED_DEVICE_FAMILY: "1,6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Hollr/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Hollr/Hollr.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Hollr/HollrMac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_CFBundleDisplayName: Hollr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hollr überträgt deine Stimme an omp /live auf deinem Server.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hollr wandelt deine Sprache direkt auf dem iPhone in Text um.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Hollr kann mit Face ID gesperrt werden, damit niemand an deine Server kommt.
        INFOPLIST_KEY_NSCameraUsageDescription: Hollr scannt den Kopplungs-QR-Code deines Servers.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hollr verbindet sich mit deinen Rechnern im lokalen Netzwerk.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  HollrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/HollrTests]
    dependencies:
      - target: Hollr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios.tests
schemes:
  Hollr:
    build:
      targets:
        Hollr: all
        HollrTests: [test]
    test:
      targets: [HollrTests]
