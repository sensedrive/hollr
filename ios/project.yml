name: Hollr
options:
  bundleIdPrefix: app.hollr
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.31.1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: "47"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.18.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
targets:
  Hollr:
    type: application
    platform: iOS
    sources:
      - path: Sources/Hollr
      - path: Sources/Shared
      - path: Resources
    dependencies:
      - target: HollrWidgets
        embed: true
        platformFilter: iOS
      - target: HollrNotify
        embed: true
        platformFilter: iOS
      - target: HollrShare
        embed: true
        platformFilter: iOS
      - package: Citadel
      - package: MarkdownUI
      - package: WhisperKit
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios
        # slow type-checking breaks the CI Release builds: Xcode warns early
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=300 -Xfrontend -warn-long-function-bodies=300"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY_MACCATALYST: "6"
        TARGETED_DEVICE_FAMILY: "1,6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Hollr/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Hollr/Hollr.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Hollr/HollrMac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_CFBundleDisplayName: Hollr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hollr überträgt deine Stimme an omp /live auf deinem Server.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hollr wandelt deine Sprache direkt auf dem iPhone in Text um.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Hollr kann mit Face ID gesperrt werden, damit niemand an deine Server kommt.
        INFOPLIST_KEY_NSCameraUsageDescription: Hollr scannt den Kopplungs-QR-Code deines Servers.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hollr verbindet sich mit deinen Rechnern im lokalen Netzwerk.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  HollrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
        excludes: [Info.plist, Widgets.entitlements]
      - path: Sources/Shared
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios.widgets
        CODE_SIGN_ENTITLEMENTS: Sources/Widgets/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  HollrNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotifyExtension
        excludes: [Info.plist]
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios.notify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/NotifyExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  HollrShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
        excludes: [Info.plist, Share.entitlements]
      - path: Sources/Shared/SharedInbox.swift
      - path: Sources/Shared/SharedKeychain.swift
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios.share
        CODE_SIGN_ENTITLEMENTS: Sources/ShareExtension/Share.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  HollrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/HollrTests]
    dependencies:
      - target: Hollr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hollr.ios.tests
schemes:
  Hollr:
    build:
      targets:
        Hollr: all
        HollrTests: [test]
    test:
      targets: [HollrTests]
